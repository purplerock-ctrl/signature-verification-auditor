[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sigaudit"
dynamic = ["version"]
description = "Audit webhook endpoints for broken HMAC signature verification (missing, forged, tampered and replayed callbacks)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Benjamin McCourt" }]
keywords = ["security", "webhook", "hmac", "signature", "audit", "stripe", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]
# Dependencies of examples/stripe-receiver (and its test).
examples = [
    "flask>=3.0",
    "stripe>=10.0",
]

[project.scripts]
sigaudit = "sigaudit.cli:main"

[project.urls]
Homepage = "https://github.com/purplerock-ctrl/signature-verification-auditor"
Issues = "https://github.com/purplerock-ctrl/signature-verification-auditor/issues"

[tool.hatch.version]
path = "src/sigaudit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sigaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF", "PT"]
ignore = [
    "S101",   # assert is fine in tests
    "S311",   # we do not use `random` for crypto; flagged uses are non-security
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]  # hard-coded test secrets are intentional
